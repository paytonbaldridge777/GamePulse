<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UFO Shooter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
    canvas { display: block; }

    #hud {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 10;
    }

    #score-panel {
      position: absolute;
      top: 24px; left: 50%;
      transform: translateX(-50%);
      color: #0ff;
      font-size: 22px;
      font-weight: bold;
      text-shadow: 0 0 12px #0ff, 0 0 24px #0ff;
      letter-spacing: 3px;
    }

    #health-bar {
      position: absolute;
      bottom: 32px; left: 50%;
      transform: translateX(-50%);
      width: 240px;
    }
    #health-label {
      color: #0f8;
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 6px;
      text-align: center;
      text-shadow: 0 0 8px #0f8;
    }
    #health-track {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(0,255,128,0.4);
      height: 14px;
      border-radius: 7px;
      overflow: hidden;
    }
    #health-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #0f8, #0ff);
      border-radius: 7px;
      transition: width 0.2s, background 0.2s;
    }

    #ammo-panel {
      position: absolute;
      bottom: 80px; right: 32px;
      color: #ff0;
      font-size: 14px;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #ff0;
    }

    #wave-banner {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #ff4488;
      font-size: 48px;
      font-weight: bold;
      text-shadow: 0 0 20px #ff4488, 0 0 40px #ff4488;
      letter-spacing: 6px;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }

    #crosshair {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 24px; height: 24px;
      pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.8);
    }
    #crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
    #crosshair::after  { width: 100%; height: 2px; top: 50%; transform: translateY(-50%); }

    #start-screen, #gameover-screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.75);
      pointer-events: all;
    }
    #gameover-screen { display: none; }

    .screen-title {
      color: #0ff;
      font-size: 64px;
      font-weight: bold;
      letter-spacing: 6px;
      text-shadow: 0 0 30px #0ff, 0 0 60px #0ff;
      margin-bottom: 12px;
    }
    .screen-subtitle {
      color: #ff4488;
      font-size: 22px;
      letter-spacing: 4px;
      text-shadow: 0 0 12px #ff4488;
      margin-bottom: 40px;
    }
    .screen-controls {
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      line-height: 2;
      letter-spacing: 1px;
      text-align: center;
      margin-bottom: 40px;
    }
    .btn {
      background: transparent;
      border: 2px solid #0ff;
      color: #0ff;
      font-family: 'Courier New', monospace;
      font-size: 18px;
      letter-spacing: 4px;
      padding: 14px 40px;
      cursor: pointer;
      text-shadow: 0 0 8px #0ff;
      box-shadow: 0 0 16px rgba(0,255,255,0.3);
      transition: all 0.2s;
      pointer-events: all;
    }
    .btn:hover {
      background: rgba(0,255,255,0.15);
      box-shadow: 0 0 30px rgba(0,255,255,0.6);
    }
    #final-score {
      color: #ff0;
      font-size: 32px;
      letter-spacing: 4px;
      text-shadow: 0 0 16px #ff0;
      margin-bottom: 32px;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="score-panel">SCORE: <span id="score-val">0</span> &nbsp;|&nbsp; WAVE: <span id="wave-val">1</span></div>
  <div id="health-bar">
    <div id="health-label">HULL INTEGRITY</div>
    <div id="health-track"><div id="health-fill"></div></div>
  </div>
  <div id="ammo-panel">AMMO: <span id="ammo-val">&#x221e;</span></div>
  <div id="crosshair"></div>
  <div id="wave-banner"></div>

  <div id="start-screen">
    <div class="screen-title">UFO SHOOTER</div>
    <div class="screen-subtitle">DEFEND EARTH</div>
    <div class="screen-controls">
      WASD / ARROWS &mdash; Move Tank<br>
      MOUSE &mdash; Aim Turret<br>
      LEFT CLICK / SPACE &mdash; Fire<br>
      R &mdash; Restart (when dead)
    </div>
    <button class="btn" id="start-btn">LAUNCH GAME</button>
  </div>

  <div id="gameover-screen">
    <div class="screen-title">GAME OVER</div>
    <div id="final-score">SCORE: <span id="final-score-val">0</span></div>
    <button class="btn" id="restart-btn">PLAY AGAIN</button>
  </div>
</div>

<script src="https://unpkg.com/three@0.165.0/build/three.min.js"></script>
<script>
// ─── Constants ───────────────────────────────────────────────────────────────
var GROUND_SIZE    = 120;
var TANK_SPEED     = 8;
var BULLET_SPEED   = 60;
var BULLET_LIFE    = 2.5;
var UFO_BASE_SPEED = 3.5;
var MAX_HEALTH     = 100;
var SHOT_COOLDOWN  = 0.22;

// ─── Palette ─────────────────────────────────────────────────────────────────
var C = {
  ground1:  0x1a2a1a,
  tankBody: 0x2ecc40,
  tankTurr: 0x27ae60,
  tankBarr: 0xf1c40f,
  ufoBody:  0x9b59b6,
  ufoLight: 0xe74c3c,
  bullet:   0xffff00,
  explode: [0xff4500, 0xff8c00, 0xffd700, 0xff69b4, 0xffffff],
};

// ─── Scene & Renderer ────────────────────────────────────────────────────────
var canvas   = document.getElementById('c');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

var scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0020, 0.012);

var camera = new THREE.PerspectiveCamera(65, 1, 0.1, 400);

// ─── Lights ──────────────────────────────────────────────────────────────────
function setupLights() {
  scene.add(new THREE.AmbientLight(0x223344, 1.2));

  var sun = new THREE.DirectionalLight(0xffeedd, 1.8);
  sun.position.set(30, 60, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far  = 200;
  sun.shadow.camera.left = sun.shadow.camera.bottom = -80;
  sun.shadow.camera.right = sun.shadow.camera.top   =  80;
  sun.shadow.bias = -0.001;
  scene.add(sun);

  scene.add(new THREE.HemisphereLight(0x0033ff, 0x002200, 0.6));
}

// ─── Ground ──────────────────────────────────────────────────────────────────
function buildGround() {
  var geo = new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE, 24, 24);
  var pos = geo.attributes.position;
  for (var i = 0; i < pos.count; i++) {
    pos.setZ(i, (Math.random() - 0.5) * 0.6);
  }
  geo.computeVertexNormals();

  var mesh = new THREE.Mesh(geo,
    new THREE.MeshLambertMaterial({ color: C.ground1, flatShading: true }));
  mesh.rotation.x = -Math.PI / 2;
  mesh.receiveShadow = true;
  scene.add(mesh);

  var grid = new THREE.GridHelper(GROUND_SIZE, 30, 0x00ff88, 0x003322);
  grid.material.opacity = 0.25;
  grid.material.transparent = true;
  grid.position.y = 0.02;
  scene.add(grid);

  for (var i = 0; i < 40; i++) {
    var r = 2 + Math.random() * 3;
    var rock = new THREE.Mesh(
      new THREE.IcosahedronGeometry(r, 0),
      new THREE.MeshLambertMaterial({
        color: new THREE.Color().setHSL(0.3 + Math.random() * 0.1, 0.3, 0.15 + Math.random() * 0.1),
        flatShading: true,
      })
    );
    rock.position.set(
      (Math.random() - 0.5) * (GROUND_SIZE - 10),
      r * 0.4,
      (Math.random() - 0.5) * (GROUND_SIZE - 10)
    );
    rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    rock.castShadow = true;
    scene.add(rock);
  }

  for (var i = 0; i < 20; i++) {
    buildTree(
      (Math.random() - 0.5) * (GROUND_SIZE - 15),
      (Math.random() - 0.5) * (GROUND_SIZE - 15)
    );
  }
}

function buildTree(x, z) {
  var trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.5, 3, 5),
    new THREE.MeshLambertMaterial({ color: 0x5d4037, flatShading: true })
  );
  trunk.position.set(x, 1.5, z);
  trunk.castShadow = true;
  scene.add(trunk);

  var hue = 0.28 + Math.random() * 0.1;
  var lightness = 0.25 + Math.random() * 0.15;
  for (var l = 0; l < 3; l++) {
    var s = 2.5 - l * 0.5;
    var leaf = new THREE.Mesh(
      new THREE.ConeGeometry(s, s * 1.4, 6),
      new THREE.MeshLambertMaterial({
        color: new THREE.Color().setHSL(hue, 0.7, lightness),
        flatShading: true,
      })
    );
    leaf.position.set(x, 3 + l * 2, z);
    leaf.rotation.y = Math.random() * Math.PI;
    leaf.castShadow = true;
    scene.add(leaf);
  }
}

// ─── Stars ───────────────────────────────────────────────────────────────────
function buildStars() {
  var n = 1800;
  var positions = new Float32Array(n * 3);
  for (var i = 0; i < n; i++) {
    var theta = Math.random() * Math.PI * 2;
    var phi   = Math.acos(2 * Math.random() - 1);
    var r     = 180 + Math.random() * 40;
    positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = Math.abs(r * Math.cos(phi));
    positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  scene.add(new THREE.Points(geo,
    new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, sizeAttenuation: true })));
}

// ─── Moon ────────────────────────────────────────────────────────────────────
function buildMoon() {
  var moon = new THREE.Mesh(
    new THREE.IcosahedronGeometry(8, 1),
    new THREE.MeshLambertMaterial({ color: 0xddddcc, flatShading: true })
  );
  moon.position.set(70, 80, -100);
  scene.add(moon);

  var glow = new THREE.PointLight(0xaaaaff, 0.4, 200);
  glow.position.copy(moon.position);
  scene.add(glow);
}

// ─── Tank ────────────────────────────────────────────────────────────────────
function Tank() {
  this.group  = new THREE.Group();
  this.turret = new THREE.Group();
  this.health = MAX_HEALTH;
  this.alive  = true;
  this._build();
  scene.add(this.group);
}

Tank.prototype._build = function() {
  var body = new THREE.Mesh(
    new THREE.BoxGeometry(3, 1.2, 4.5),
    new THREE.MeshLambertMaterial({ color: C.tankBody, flatShading: true })
  );
  body.castShadow = true;
  body.receiveShadow = true;
  this.group.add(body);

  var self = this;
  [-1.7, 1.7].forEach(function(side) {
    var track = new THREE.Mesh(
      new THREE.BoxGeometry(0.7, 0.8, 5),
      new THREE.MeshLambertMaterial({ color: 0x222222, flatShading: true })
    );
    track.position.set(side, -0.3, 0);
    track.castShadow = true;
    self.group.add(track);

    for (var w = -2; w <= 2; w++) {
      var wheel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.4, 0.4, 0.8, 8),
        new THREE.MeshLambertMaterial({ color: 0x333333, flatShading: true })
      );
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(side, -0.6, w * 1.1);
      self.group.add(wheel);
    }
  });

  var tBase = new THREE.Mesh(
    new THREE.CylinderGeometry(1.0, 1.1, 0.6, 7),
    new THREE.MeshLambertMaterial({ color: C.tankTurr, flatShading: true })
  );
  tBase.position.y = 0.3;
  tBase.castShadow = true;
  this.group.add(tBase);

  var tDome = new THREE.Mesh(
    new THREE.SphereGeometry(0.85, 6, 5),
    new THREE.MeshLambertMaterial({ color: C.tankTurr, flatShading: true })
  );
  tDome.position.y = 0.2;
  tDome.castShadow = true;
  this.turret.add(tDome);

  var barrel = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 0.2, 2.5, 6),
    new THREE.MeshLambertMaterial({ color: C.tankBarr, flatShading: true })
  );
  barrel.rotation.x = Math.PI / 2;
  barrel.position.set(0, 0.3, -1.6);
  barrel.castShadow = true;
  this.turret.add(barrel);

  this.muzzlePoint = new THREE.Object3D();
  this.muzzlePoint.position.set(0, 0.3, -2.9);
  this.turret.add(this.muzzlePoint);

  this.turret.position.y = 0.9;
  this.group.add(this.turret);
  this.group.position.y = 0.8;
};

Tank.prototype.getMuzzleWorldPos = function() {
  var v = new THREE.Vector3();
  this.muzzlePoint.getWorldPosition(v);
  return v;
};

Tank.prototype.aimAt = function(worldTarget) {
  var local = this.group.worldToLocal(worldTarget.clone());
  this.turret.rotation.y = Math.atan2(local.x, local.z) + Math.PI;
};

Tank.prototype.takeDamage = function(amt) {
  this.health = Math.max(0, this.health - amt);
  if (this.health <= 0) this.alive = false;
};

Tank.prototype.update = function(dt, keys) {
  if (!this.alive) return;
  var moveDir = new THREE.Vector3();
  if (keys.forward) moveDir.z -= 1;
  if (keys.back)    moveDir.z += 1;
  if (keys.left)    this.group.rotation.y += 1.8 * dt;
  if (keys.right)   this.group.rotation.y -= 1.8 * dt;

  if (moveDir.length() > 0) {
    moveDir.normalize().applyQuaternion(this.group.quaternion);
    this.group.position.addScaledVector(moveDir, TANK_SPEED * dt);
    var half = GROUND_SIZE / 2 - 3;
    this.group.position.x = Math.max(-half, Math.min(half, this.group.position.x));
    this.group.position.z = Math.max(-half, Math.min(half, this.group.position.z));
  }
};

// ─── UFO ─────────────────────────────────────────────────────────────────────
function UFO(wave) {
  this.group      = new THREE.Group();
  this.alive      = true;
  this.health     = 1 + Math.floor(wave * 0.4);
  this.speed      = UFO_BASE_SPEED + wave * 0.3 + Math.random() * 1.5;
  this.orbitR     = 18 + Math.random() * 22;
  this.orbitAngle = Math.random() * Math.PI * 2;
  this.orbitH     = 14 + Math.random() * 12;
  this.orbitDir   = Math.random() < 0.5 ? 1 : -1;
  this.wobble     = Math.random() * Math.PI * 2;
  this.beamTime   = 0;
  this._build();
  scene.add(this.group);
  this.group.position.set(
    this.orbitR * Math.cos(this.orbitAngle),
    this.orbitH,
    this.orbitR * Math.sin(this.orbitAngle)
  );
}

UFO.prototype._build = function() {
  var bodyGeo = new THREE.SphereGeometry(2.2, 8, 5);
  bodyGeo.scale(1, 0.38, 1);
  var body = new THREE.Mesh(bodyGeo,
    new THREE.MeshLambertMaterial({ color: C.ufoBody, flatShading: true }));
  body.castShadow = true;
  this.group.add(body);

  var dome = new THREE.Mesh(
    new THREE.SphereGeometry(1.0, 7, 6, 0, Math.PI * 2, 0, Math.PI / 2),
    new THREE.MeshLambertMaterial({ color: 0x88eeff, flatShading: true, transparent: true, opacity: 0.75 })
  );
  dome.position.y = 0.35;
  this.group.add(dome);

  var rim = new THREE.Mesh(
    new THREE.TorusGeometry(2.0, 0.18, 5, 12),
    new THREE.MeshBasicMaterial({ color: C.ufoLight })
  );
  rim.rotation.x = Math.PI / 2;
  this.group.add(rim);
  this.rim = rim;

  var bl = new THREE.Mesh(
    new THREE.CircleGeometry(0.6, 6),
    new THREE.MeshBasicMaterial({ color: 0xffff00, side: THREE.DoubleSide })
  );
  bl.rotation.x = Math.PI / 2;
  bl.position.y = -0.5;
  this.group.add(bl);
  this.bottomLight = bl;

  var beam = new THREE.Mesh(
    new THREE.ConeGeometry(3, 12, 6, 1, true),
    new THREE.MeshBasicMaterial({ color: 0xffdd00, transparent: true, opacity: 0.18, side: THREE.DoubleSide })
  );
  beam.position.y = -6.5;
  beam.visible = false;
  this.group.add(beam);
  this.beam = beam;

  var light = new THREE.PointLight(C.ufoLight, 0.8, 12);
  light.position.y = -1;
  this.group.add(light);
};

UFO.prototype.update = function(dt, tankPos) {
  if (!this.alive) return;
  this.orbitAngle += this.orbitDir * (this.speed / this.orbitR) * dt;
  this.wobble     += dt * 0.9;
  this.group.position.set(
    this.orbitR * Math.cos(this.orbitAngle),
    this.orbitH + Math.sin(this.wobble) * 1.2,
    this.orbitR * Math.sin(this.orbitAngle)
  );
  this.group.rotation.y += dt * 0.7;

  var pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.004);
  this.rim.material.color.setHSL(0.02, 1, 0.4 + pulse * 0.4);
  this.bottomLight.material.color.setHSL(0.15, 1, 0.5 + pulse * 0.3);

  var dist = this.group.position.distanceTo(tankPos);
  if (dist < 22) {
    this.beamTime += dt;
    this.beam.visible = (this.beamTime % 3) < 1.5;
  } else {
    this.beam.visible = false;
    this.beamTime = 0;
  }
};

UFO.prototype.hit = function() {
  this.health--;
  this.group.traverse(function(obj) {
    if (obj.isMesh && obj.material.emissive) {
      obj.material.emissive.setHex(0xffffff);
      setTimeout(function() {
        if (obj.material.emissive) obj.material.emissive.setHex(0x000000);
      }, 80);
    }
  });
  if (this.health <= 0) {
    this.alive = false;
    scene.remove(this.group);
    return true;
  }
  return false;
};

// ─── Bullet ──────────────────────────────────────────────────────────────────
function Bullet(origin, dir) {
  this.mesh  = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.18, 0),
    new THREE.MeshBasicMaterial({ color: C.bullet })
  );
  this.mesh.position.copy(origin);
  this.dir   = dir.clone().normalize();
  this.life  = BULLET_LIFE;
  this.alive = true;

  var glow = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 5, 5),
    new THREE.MeshBasicMaterial({ color: 0xffee44, transparent: true, opacity: 0.35 })
  );
  this.mesh.add(glow);
  this.mesh.add(new THREE.PointLight(0xffff00, 1.5, 6));
  scene.add(this.mesh);
}

Bullet.prototype.update = function(dt) {
  if (!this.alive) return;
  this.mesh.position.addScaledVector(this.dir, BULLET_SPEED * dt);
  this.life -= dt;
  if (this.life <= 0) this.destroy();
};

Bullet.prototype.destroy = function() {
  this.alive = false;
  scene.remove(this.mesh);
};

// ─── Explosion ───────────────────────────────────────────────────────────────
function Explosion(pos) {
  this.particles = [];
  this.alive     = true;
  this.life      = 1.2;

  for (var i = 0; i < 22; i++) {
    var s = 0.3 + Math.random() * 0.7;
    var m = new THREE.Mesh(
      new THREE.IcosahedronGeometry(s, 0),
      new THREE.MeshBasicMaterial({ color: C.explode[Math.floor(Math.random() * C.explode.length)] })
    );
    m.position.copy(pos);
    var vel = new THREE.Vector3(
      (Math.random() - 0.5) * 18,
      Math.random() * 14 + 2,
      (Math.random() - 0.5) * 18
    );
    this.particles.push({ mesh: m, vel: vel, scale: s });
    scene.add(m);
  }

  this.flash = new THREE.PointLight(0xff6600, 8, 30);
  this.flash.position.copy(pos);
  scene.add(this.flash);
}

Explosion.prototype.update = function(dt) {
  if (!this.alive) return;
  this.life -= dt;
  var t = 1 - Math.max(0, this.life / 1.2);

  for (var i = 0; i < this.particles.length; i++) {
    var p = this.particles[i];
    p.vel.y -= 18 * dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    var s = p.scale * (1 - t * 0.7);
    p.mesh.scale.setScalar(Math.max(0.01, s));
    p.mesh.material.opacity = 1 - t;
    p.mesh.material.transparent = true;
  }

  this.flash.intensity = Math.max(0, 8 * (1 - t * 3));

  if (this.life <= 0) {
    this.alive = false;
    for (var i = 0; i < this.particles.length; i++) scene.remove(this.particles[i].mesh);
    scene.remove(this.flash);
  }
};

// ─── Muzzle Flash ────────────────────────────────────────────────────────────
function MuzzleFlash(pos) {
  this.life  = 0.08;
  this.alive = true;
  this.light = new THREE.PointLight(0xffff88, 5, 8);
  this.light.position.copy(pos);
  scene.add(this.light);
  this.mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 4, 4),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  this.mesh.position.copy(pos);
  scene.add(this.mesh);
}

MuzzleFlash.prototype.update = function(dt) {
  this.life -= dt;
  if (this.life <= 0) {
    this.alive = false;
    scene.remove(this.light);
    scene.remove(this.mesh);
  }
};

// ─── Input ───────────────────────────────────────────────────────────────────
var keys = { forward: false, back: false, left: false, right: false };
var mouse = { x: 0, y: 0 };
var shootPressed = false;

document.addEventListener('keydown', function(e) {
  if (e.code === 'KeyW' || e.code === 'ArrowUp')    keys.forward = true;
  if (e.code === 'KeyS' || e.code === 'ArrowDown')  keys.back    = true;
  if (e.code === 'KeyA' || e.code === 'ArrowLeft')  keys.left    = true;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right   = true;
  if (e.code === 'Space') { e.preventDefault(); shootPressed = true; }
  if (e.code === 'KeyR') restartGame();
});
document.addEventListener('keyup', function(e) {
  if (e.code === 'KeyW' || e.code === 'ArrowUp')    keys.forward = false;
  if (e.code === 'KeyS' || e.code === 'ArrowDown')  keys.back    = false;
  if (e.code === 'KeyA' || e.code === 'ArrowLeft')  keys.left    = false;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right   = false;
  if (e.code === 'Space') shootPressed = false;
});
document.addEventListener('mousemove', function(e) {
  mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
});
document.addEventListener('mousedown', function(e) { if (e.button === 0) shootPressed = true; });
document.addEventListener('mouseup',   function(e) { if (e.button === 0) shootPressed = false; });

// ─── Aim raycasting ──────────────────────────────────────────────────────────
var raycaster = new THREE.Raycaster();

function getAimTarget() {
  raycaster.setFromCamera(mouse, camera);
  var target = new THREE.Vector3();

  var ufoMeshes = [];
  for (var i = 0; i < ufos.length; i++) ufoMeshes.push(ufos[i].group);
  var hits = raycaster.intersectObjects(ufoMeshes, true);
  if (hits.length > 0) return hits[0].point;

  var skyPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -12);
  raycaster.ray.intersectPlane(skyPlane, target);
  return target;
}

// ─── HUD ─────────────────────────────────────────────────────────────────────
var scoreEl     = document.getElementById('score-val');
var waveEl      = document.getElementById('wave-val');
var healthFill  = document.getElementById('health-fill');
var waveBanner  = document.getElementById('wave-banner');
var gameOverScr = document.getElementById('gameover-screen');
var finalScoreEl = document.getElementById('final-score-val');

function updateHUD(score, wave, hp) {
  scoreEl.textContent = score;
  waveEl.textContent  = wave;
  var pct = (hp / MAX_HEALTH) * 100;
  healthFill.style.width = pct + '%';
  if (pct > 50)      healthFill.style.background = 'linear-gradient(90deg,#0f8,#0ff)';
  else if (pct > 25) healthFill.style.background = 'linear-gradient(90deg,#ff0,#ffa500)';
  else               healthFill.style.background = 'linear-gradient(90deg,#f00,#ff4488)';
}

var bannerTimeout;
function showWaveBanner(n) {
  waveBanner.textContent = 'WAVE ' + n;
  waveBanner.style.opacity = '1';
  clearTimeout(bannerTimeout);
  bannerTimeout = setTimeout(function() { waveBanner.style.opacity = '0'; }, 2200);
}

// ─── Game state ───────────────────────────────────────────────────────────────
var tank, ufos, bullets, explosions, flashes;
var score, wave, shotCooldown, gameRunning;
var lastTime = 0;

function initGame() {
  while (scene.children.length) scene.remove(scene.children[0]);

  setupLights();
  buildGround();
  buildStars();
  buildMoon();

  tank       = new Tank();
  ufos       = [];
  bullets    = [];
  explosions = [];
  flashes    = [];
  score      = 0;
  wave       = 1;
  shotCooldown = 0;
  gameRunning  = true;

  spawnWave(wave);
  updateHUD(score, wave, tank.health);
}

function spawnWave(n) {
  var count = 3 + n * 2;
  for (var i = 0; i < count; i++) ufos.push(new UFO(n));
  showWaveBanner(n);
}

function shoot() {
  var muzzlePos = tank.getMuzzleWorldPos();
  var aim = getAimTarget();
  var dir = aim.clone().sub(muzzlePos).normalize();
  if (dir.y < 0.1) { dir.y = 0.3; dir.normalize(); }
  bullets.push(new Bullet(muzzlePos, dir));
  flashes.push(new MuzzleFlash(muzzlePos));
}

// ─── Main loop ───────────────────────────────────────────────────────────────
function loop(ts) {
  requestAnimationFrame(loop);

  var dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;

  resize();

  if (!gameRunning) {
    renderer.render(scene, camera);
    return;
  }

  tank.update(dt, keys);
  var aim = getAimTarget();
  if (aim && aim.length() > 0) tank.aimAt(aim);

  var tankPos = tank.group.position;
  var camTarget = new THREE.Vector3(tankPos.x, tankPos.y + 18, tankPos.z + 14);
  camera.position.lerp(camTarget, 0.06);
  camera.lookAt(tankPos.x, tankPos.y + 2, tankPos.z);

  shotCooldown = Math.max(0, shotCooldown - dt);
  if (shootPressed && shotCooldown <= 0) {
    shoot();
    shotCooldown = SHOT_COOLDOWN;
  }

  for (var i = bullets.length - 1; i >= 0; i--) {
    bullets[i].update(dt);
    if (!bullets[i].alive) { bullets.splice(i, 1); continue; }

    for (var j = ufos.length - 1; j >= 0; j--) {
      if (bullets[i] && bullets[i].mesh.position.distanceTo(ufos[j].group.position) < 2.8) {
        bullets[i].destroy();
        bullets.splice(i, 1);
        var killed = ufos[j].hit();
        if (killed) {
          explosions.push(new Explosion(ufos[j].group.position.clone()));
          ufos.splice(j, 1);
          score += 100 * wave;
        }
        break;
      }
    }
  }

  for (var i = ufos.length - 1; i >= 0; i--) {
    ufos[i].update(dt, tankPos);
    if (ufos[i].group.position.distanceTo(tankPos) < 5) {
      tank.takeDamage(15 * dt);
    }
  }

  for (var i = explosions.length - 1; i >= 0; i--) {
    explosions[i].update(dt);
    if (!explosions[i].alive) explosions.splice(i, 1);
  }
  for (var i = flashes.length - 1; i >= 0; i--) {
    flashes[i].update(dt);
    if (!flashes[i].alive) flashes.splice(i, 1);
  }

  if (ufos.length === 0) {
    wave++;
    spawnWave(wave);
  }

  if (!tank.alive) {
    gameRunning = false;
    finalScoreEl.textContent = score;
    gameOverScr.style.display = 'flex';
  }

  updateHUD(score, wave, tank.health);
  renderer.render(scene, camera);
}

function resize() {
  var w = window.innerWidth, h = window.innerHeight;
  if (canvas.width !== w || canvas.height !== h) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
}

function restartGame() {
  gameOverScr.style.display = 'none';
  initGame();
}

document.getElementById('start-btn').addEventListener('click', function() {
  document.getElementById('start-screen').style.display = 'none';
  initGame();
  requestAnimationFrame(function(ts) { lastTime = ts; loop(ts); });
});
document.getElementById('restart-btn').addEventListener('click', restartGame);
</script>
</body>
</html>
